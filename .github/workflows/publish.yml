# Render the site and deploy it to GitHub Pages on every push to main, that is, every merged PR.
# Needs Settings → Pages → Source set to "GitHub Actions". Nothing is pushed to the gh-pages branch.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                # one deploy at a time; a newer push waits instead of cancelling
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19  # same as the laptop; bump both together
      - uses: quarto-dev/quarto-actions/render@v2
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
