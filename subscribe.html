<!-- Email subscription (Buttondown). A plain form post, as Buttondown requires: no JavaScript. -->
<div class="subscribe-box">
  <form action="https://buttondown.com/api/emails/embed-subscribe/migsilva15" method="post" target="_blank">
    <label for="subscribe-email" class="subscribe-title">New posts by email</label>
    <input type="email" name="email" id="subscribe-email" class="form-control form-control-sm" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit" class="btn btn-outline-primary btn-sm">Subscribe</button>
  </form>
  <p class="subscribe-note">No tracking, unsubscribe anytime. <a href="/privacy.html">Privacy</a> · <a href="/index.xml">RSS</a></p>
</div>
