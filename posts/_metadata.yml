# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Plain title block (no coloured banner) and a table of contents in the right margin
title-block-banner: false
toc: true

# Comments on every post, stored in this repo's GitHub Discussions (giscus).
# One discussion per post, matched by the page path, so post URLs should not change.
comments:
  giscus:
    repo: miguelsilva15/migsilva.com
    repo-id: R_kgDOVGTycQ
    category: Announcements
    category-id: DIC_kwDOVGTycc4DIHFq
    mapping: pathname
    theme:
      light: light
      dark: dark
